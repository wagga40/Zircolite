[pytest]
# Minimum pytest version
minversion = 7.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options. Coverage is deliberately not here: forcing --cov makes a
# plain `pytest` abort with "unrecognized arguments" wherever pytest-cov is
# absent, before a single test is collected. Ask for it explicitly:
#   pytest --cov=zircolite --cov-report=term-missing
addopts =
    -v
    --tb=short
    -ra
    --strict-markers
    --color=yes

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    requires_lxml: marks tests that require lxml
    requires_sigma: marks tests that require pySigma
    requires_py7zr: marks tests that require the py7zr 7-Zip library

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (in seconds). Without it a hung test holds the CI job open
# until GitHub's six-hour default rather than failing in five minutes.
timeout = 300
