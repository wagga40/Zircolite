name: build_pyinstaller

# Mirror of .github/workflows/build_pyinstaller.yml, reduced to the linux-x64
# leg -- the one a single x86_64 Linux runner can serve -- with that leg's
# verify smoke run at the end of the same job. The other four legs, the
# older-distribution containers and the release stay GitHub-only; see
# .forgejo/README.md.
#
# A push stands in for GitHub's canary and a manual run for its full build: only
# the manual run tests -U, which downloads rulesets.

on:
  push:
    paths:
      - Zircolite.spec
      - zircolite.py
      - "zircolite/**"
      - pyproject.toml
      - pdm.lock
      - setup.py
      - "config/**"
      - "rules/**"
      - "templates/**"
      - "gui/**"
      - "tests/fixtures/**"
      - "tests/golden/**"
      - tests/conftest.py
      - pytest.ini
      - tests/test_frozen_binary.py
      - tests/test_e2e_regression.py
      - "tools/**"
      - .forgejo/workflows/build_pyinstaller.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ZIRCOLITE_REQUIRE_NATIVE: "1"
  # Inert on this Linux runner; it mirrors the GitHub side, where the Windows
  # legs need it.
  PYTHONUTF8: "1"
  GLIBC_FLOOR: "2.28"

jobs:
  build:
    runs-on: ubuntu-latest
    # The image GitHub builds linux-x64 in, at the same dated tag.
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.09.14-1
    timeout-minutes: 90
    steps:
      # GitHub mounts its own node into a job container; this runner does not,
      # and the image has none, so every JS action below needs this first. The
      # nodejs:22 stream has no default profile, hence /common.
      - name: Install node
        run: dnf -y module install nodejs:22/common

      - uses: actions/checkout@v4

      # The image's CPython builds are static, and PyInstaller needs a shared
      # libpython, so they only run pdm.
      - name: Install pdm
        run: |
          /opt/python/cp314-cp314/bin/python -m pip install --upgrade --quiet pip pdm
          echo /opt/python/cp314-cp314/bin >> "$GITHUB_PATH"

      # uv marks the Python it installs EXTERNALLY-MANAGED, so nothing is
      # pip-installed into it: pdm builds the project's venv from it.
      - name: Select Python 3.14
        run: |
          uv python install 3.14
          pdm use -f "$(uv python find 3.14)"

      # Installing the project compiles the flattening kernel the spec bundles,
      # and ZIRCOLITE_REQUIRE_NATIVE turns a failed compile into a failed step.
      - name: Install dependencies
        run: pdm install --dev

      - name: Build with PyInstaller
        run: pdm run pyinstaller --noconfirm Zircolite.spec

      - name: Test the binary against the source tree
        run: |
          export ZIRCOLITE_BINARY="$GITHUB_WORKSPACE/dist/Zircolite/Zircolite"
          export ZIRCOLITE_GLIBC_FLOOR="$GLIBC_FLOOR"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            export ZIRCOLITE_TEST_NETWORK=1
          fi
          pdm run python -m pytest tests/test_frozen_binary.py tests/test_e2e_regression.py

      - name: Package
        id: package
        env:
          ZIRCOLITE_TARGET: linux-x64
        run: |
          pdm run python tools/package-release.py
          shopt -s nullglob
          archives=(dist/Zircolite-*-"$ZIRCOLITE_TARGET".tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "expected one archive for $ZIRCOLITE_TARGET, found: ${archives[*]}" >&2
            exit 1
          fi
          echo "path=${archives[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${archives[0]}")" >> "$GITHUB_OUTPUT"

      # GitHub's verify job, minus the clean machine: the archive is extracted
      # and run from inside its own directory, as a user would.
      - name: Run the package
        env:
          ARCHIVE: ${{ steps.package.outputs.path }}
        run: |
          tar -xzf "$ARCHIVE"
          pkg=$(basename "$ARCHIVE" .tar.gz)
          if [ ! -x "$pkg/Zircolite" ]; then
            echo "$ARCHIVE has no executable $pkg/Zircolite" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/detections"
          cd "$pkg"
          ./Zircolite --version
          ./Zircolite -e ../tests/fixtures/sample_bitsadmin.evtx -r rules/rules_windows_sysmon.json -o "$RUNNER_TEMP/detections/runner.json"
          ./Zircolite -e ../tests/fixtures/sample_bitsadmin.evtx -r rules/rules_windows_sysmon.json -o "$RUNNER_TEMP/detections/package.json" --package
          shopt -s nullglob
          zips=(zircogui-output-*.zip)
          if [ "${#zips[@]}" -ne 1 ] || ! unzip -l "${zips[0]}" index.html > /dev/null; then
            echo "--package did not write a Mini-GUI zip holding index.html: ${zips[*]}" >&2
            exit 1
          fi

      - name: Check the detections
        run: |
          shopt -s nullglob
          python3 - tests/golden/bitsadmin_sysmon.json "$RUNNER_TEMP"/detections/*.json <<'EOF'
          import json
          import sys

          golden, *outputs = sys.argv[1:]
          if not outputs:
              sys.exit("no detection output to check")
          with open(golden, encoding="utf-8") as f:
              expected = sorted(json.load(f))
          for output in outputs:
              with open(output, encoding="utf-8") as f:
                  found = sorted([d["title"], d["count"]] for d in json.load(f))
              if found != expected:
                  sys.exit(f"{output}: expected {expected}, got {found}")
              print(f"{output}: {found}")
          EOF

      # v4 refuses to run against anything that is not github.com:
      # "GHESNotSupportedError: @actions/artifact v2.0.0+ ... not currently
      # supported on GHES". v3 uses the older API, which Forgejo implements. It
      # zips what it uploads, which is harmless here: the executable bit lives
      # inside the tarball.
      - name: Upload the archive
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
