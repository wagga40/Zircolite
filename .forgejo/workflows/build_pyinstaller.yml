name: build_pyinstaller

# Mirror of .github/workflows/build_pyinstaller.yml, reduced to the one leg a
# single x86_64 Linux runner can serve. The linux-arm64, windows-x64 and
# windows-arm64 legs stay GitHub-only.
#
# The GitHub gate only lets this run on a commit or PR whose message contains
# "Release v". Here workflow_dispatch always runs, so a release build can be
# rehearsed before the release commit exists -- which is the point of the
# whole mirror.

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EVTX_SAMPLE_URL: "https://raw.githubusercontent.com/sbousseaden/EVTX-ATTACK-SAMPLES/master/Execution/Exec_sysmon_meterpreter_reversetcp_msipackage.evtx"
  EVTX_OUTPUT: "detected_events.json"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.18.0"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm Zircolite.spec

      - name: Download EVTX sample
        run: |
          curl -sSL -o evtx_sample.evtx "${{ env.EVTX_SAMPLE_URL }}"
          if [ ! -f evtx_sample.evtx ] || [ ! -s evtx_sample.evtx ]; then
            echo "Download failed or file empty"
            exit 1
          fi

      - name: Verify binary
        run: |
          chmod +x dist/Zircolite
          dist/Zircolite --help
          dist/Zircolite --version

      # Do not use -n (--nolog): it sets no_output=True and prevents writing detected_events.json
      - name: Run binary on EVTX
        run: dist/Zircolite -e evtx_sample.evtx -r rules/rules_windows_sysmon.json -o "${{ env.EVTX_OUTPUT }}"

      - name: Verify EVTX output
        run: |
          python -c "
          import json, sys
          p = '${{ env.EVTX_OUTPUT }}'
          with open(p) as f:
              d = json.load(f)
          if not isinstance(d, list):
              print('Expected JSON array')
              sys.exit(1)
          # The sample is a known-malicious EVTX: a build that detects nothing
          # in it is broken, and printing the count let that pass silently.
          if not d:
              print('No detections in a sample that must produce some')
              sys.exit(1)
          print(f'Detections: {len(d)}')
          "

      # Run from a directory holding nothing but the binary. The prepared
      # release package has gui/ beside it, which the asset search prefers, so
      # a --package run from there would pass even with the archive missing
      # from the bundle -- exactly the regression this guards.
      - name: Verify --package works from the bundle alone
        run: |
          mkdir -p bare
          cp dist/Zircolite bare/
          cd bare
          ./Zircolite -e ../evtx_sample.evtx -r ../rules/rules_windows_sysmon.json -o ../detected_for_package.json --package
          cd ..
          python -c "
          import pathlib, sys, zipfile
          zips = sorted(pathlib.Path('bare').glob('zircogui-output-*.zip'))
          if not zips:
              print('No zircogui-output-*.zip: gui/zircogui.zip is not in the bundle')
              sys.exit(1)
          names = zipfile.ZipFile(zips[0]).namelist()
          if 'index.html' not in names:
              print(f'{zips[0]} has no index.html; got {names[:10]}')
              sys.exit(1)
          print(f'Package OK: {zips[0]} ({len(names)} entries)')
          "

      - name: Prepare release package
        run: |
          pkg="Zircolite-linux-x64"
          mkdir -p "$pkg"
          cp dist/Zircolite "$pkg/"
          cp -r config rules templates gui docs pics "$pkg/"
          cp README.md "$pkg/"
          chmod +x "$pkg/Zircolite"

      # Do not use -n (--nolog): it sets no_output=True and prevents writing the output file
      - name: Verify package runs (from package dir)
        run: |
          cd Zircolite-linux-x64
          ./Zircolite -e ../evtx_sample.evtx -r rules/rules_windows_sysmon.json -o ../detected_from_pkg.json
          cd ..
          python -c "
          import json, sys
          with open('detected_from_pkg.json') as f:
              d = json.load(f)
          if not isinstance(d, list):
              print('Expected JSON array')
              sys.exit(1)
          if not d:
              print('No detections in a sample that must produce some')
              sys.exit(1)
          print(f'Package run OK, detections: {len(d)}')
          "

      # v4 refuses to run against anything that is not github.com:
      # "GHESNotSupportedError: @actions/artifact v2.0.0+ ... not currently
      # supported on GHES". v3 uses the older API, which Forgejo implements.
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: Zircolite-linux-x64
          path: Zircolite-linux-x64
