name: tests

# Mirror of .github/workflows/tests.yml, restricted to the legs a single
# x86_64 Linux runner can serve. The windows-latest and macos-latest legs of
# the GitHub matrix have no counterpart here and stay GitHub-only.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Inert here -- this runner is Linux, where UTF-8 is already the default. It
# mirrors the GitHub side, where the Windows legs need it.
env:
  PYTHONUTF8: "1"
  ZIRCOLITE_REQUIRE_NATIVE: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    # actions/setup-python has no Debian builds and the runner's ubuntu-latest
    # label is a Debian image; this one is Ubuntu, as on GitHub.
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    # A leg takes about four minutes. A hang, or a dependency that starts
    # building from source (duckdb did on 3.11, for 12 minutes here), fails the
    # run instead of holding it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pdm
        run: python -m pip install --upgrade --quiet pip pdm

      # Installing the project compiles the flattening kernel, and
      # ZIRCOLITE_REQUIRE_NATIVE turns a failed compile into a failed step.
      - name: Install dependencies
        run: pdm install --dev

      # No `|| true`: the suite exists to fail the build. Test fixtures are
      # tracked, so a missing one is a broken checkout and must fail too.
      - name: Run tests
        run: pdm run pytest

  # The viewer ships prebuilt in gui/viewer. This job proves the sources build
  # it byte for byte.
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: gui/source/package-lock.json
      - name: Check, test and build the viewer
        working-directory: gui/source
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: The committed viewer is what its sources build
        # intent-to-add makes a file the build newly emits show up in the diff too,
        # but skips one .gitignore matches, which every clone would then miss.
        run: |
          git add --intent-to-add gui/viewer
          git diff --exit-code gui/viewer
          git status --short --ignored -- gui/viewer
          test -z "$(git ls-files --others --ignored --exclude-standard -- gui/viewer)"

  # Drives a real package in each browser in a job of its own, as on GitHub,
  # but in Playwright's image, which already holds the browsers and every
  # library they load: installing them in the Ubuntu container meant about 70 s
  # of apt downloads per job from this host. The tag must name the Playwright
  # version in gui/source/package-lock.json, or the scripts look for browser
  # builds the image does not have; tests/test_forgejo_workflows.py checks it.
  # The package carries the committed gui/viewer, which the viewer job checks.
  viewer-browsers:
    runs-on: ubuntu-latest
    # A browser that hangs on a package must fail the run, not hold the runner.
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      ZL_BROWSERS: ${{ matrix.browser }}
      # The image has no C compiler, so this package is built with the Python
      # flattening kernel. The tests and build jobs still require the compiled one.
      ZIRCOLITE_REQUIRE_NATIVE: "0"
    steps:
      - uses: actions/checkout@v4
      # actions/checkout resolves `repository:` against this Forgejo instance,
      # which does not hold the corpus, so it is fetched from GitHub by hand.
      # A pinned public corpus: the e2e scripts assert 4688 events, detections,
      # process starts and tactics, which no one-file fixture holds.
      - name: Fetch the pinned corpus
        run: |
          git init -q EVTX-ATTACK-SAMPLES
          git -C EVTX-ATTACK-SAMPLES fetch -q --depth 1 https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES.git 4ceed2f4706daf601c212a8f91c113dd85349a2c
          git -C EVTX-ATTACK-SAMPLES checkout -q FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: gui/source/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pdm
        run: python -m pip install --upgrade --quiet pip pdm
      - name: Install dependencies
        run: pdm install --dev
      # The image has no unzip; Python's zipfile extracts the same tree.
      - name: Build a package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pdm run python zircolite.py --evtx EVTX-ATTACK-SAMPLES -r rules/rules_windows_merged.json \
            --package --package-dir "$RUNNER_TEMP/package" -o "$RUNNER_TEMP/package/detections.json" -l "$RUNNER_TEMP/package/zircolite.log" -q
          python -m zipfile -e "$RUNNER_TEMP"/package/zircolite-package-*.zip "$RUNNER_TEMP/package/unpacked"
      - name: Install the viewer's npm packages
        working-directory: gui/source
        run: npm ci
      - name: Drive the package
        working-directory: gui/source
        run: |
          npm run smoke -- "$RUNNER_TEMP/package/unpacked"
          npm run e2e -- "$RUNNER_TEMP/package/unpacked"
          npm run views -- "$RUNNER_TEMP/package/unpacked"
