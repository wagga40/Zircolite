<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zircolite Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Zircolite - Standalone Sigma-based detection tool for EVTX, Auditd, Sysmon for Linux, XML, CSV, and JSONL/NDJSON logs">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)">
  <style>
    /* The explainer diagrams are drawn at 960px; squeezed into the prose column their text
       becomes unreadable, so let them overflow it, centred, when the window has room. */
    .markdown-section p:has(> img[src$=".svg"]:only-child) {
      width: max(100%, min(960px, calc(100vw - var(--sidebar-width) - 4rem)));
      max-width: none;
      margin-left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Zircolite',
      repo: 'wagga40/Zircolite',
      auto2top: true,
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        placeholder: 'Search',
        noData: 'No results',
        depth: 3
      },
      markdown: {
        renderer: {
          code: function(token) {
            if (token.lang === 'mermaid') {
              return '<div class="mermaid">' + token.text + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    }
  </script>
  <!-- Docsify v5 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <!-- Syntax highlighting for the languages the docs use -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <!-- Mermaid diagram support -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
    });
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
      hook.doneEach(function() {
        mermaid.run({ querySelector: '.mermaid' });
      });
    });
  </script>
</body>
</html>
