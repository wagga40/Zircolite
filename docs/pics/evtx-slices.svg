<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Slices of large EVTX files</title>
  <desc id="d">Without slices, four workers process Security.evtx, 1.3 million records, and four small files: worker 1 spends the whole run on Security.evtx while the other three finish early and sit idle. With slices, Security.evtx is cut into twelve slices of about 65,536 records, each its own database, spread over the four workers after the small files, so every worker finishes at about the same time and the run ends much earlier. The matches of every slice merge back into one entry per rule for Security.evtx in detected_events.json.</desc>
  <style>
    :root {
      --paper: #eef1ef;
      --panel: #f8faf8;
      --ink: #16211e;
      --ink-2: #4a5955;
      --rule: #cfd8d4;
      --signal: #00697a;
      --strip: #7c8b87;
      --danger: #a3134e;
      --sev-0: #687b8a;
      --sev-unknown: #5a2f96;
      --amber: #9a6a00;
      --olive: #4f7a28;
    }
    @media (prefers-color-scheme: dark) {
