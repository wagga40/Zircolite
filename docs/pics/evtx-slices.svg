    .ink2 { fill: var(--ink-2); }
    .step { font-weight: 600; }
    .step .ink2 { font-weight: 400; }
    .on-bar { fill: var(--paper); font-size: 11px; }
    .fa { fill: var(--signal); }
    .fb { fill: var(--sev-0); }
    .fc { fill: var(--sev-unknown); }
    .fd { fill: var(--amber); }
    .fe { fill: var(--olive); }
    .idle { fill: none; stroke: var(--rule); stroke-width: 2; stroke-dasharray: 4 4; }
    .wall { fill: none; stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .wall-text { fill: var(--danger); font-weight: 600; font-size: 12px; }
    .ghost { fill: none; stroke: var(--strip); stroke-width: 1.5; stroke-dasharray: 3 3; opacity: 0.6; }
    .saved { fill: none; stroke: var(--strip); stroke-width: 1.5; }
    .saved-head { fill: var(--strip); }
    .arrow { fill: none; stroke: var(--strip); stroke-width: 1.5; }
    .head { fill: var(--strip); }
    .divider { stroke: var(--rule); }
    .grow { transform-box: fill-box; transform-origin: left center; }

